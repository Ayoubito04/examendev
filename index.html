<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ExamenDev: practica preguntas tipo test de los módulos de DAM, DAW, ASIR y SMR, con corrección al instante, simulacros cronometrados y seguimiento de tu progreso." />
    <meta name="theme-color" content="#061c11" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema guardado antes de pintar para evitar un destello claro.
      try {
        var t = localStorage.getItem('examendev:tema') || 'sistema';
        if (t === 'sistema') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
        document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>
    <title>ExamenDev · Practica tu examen de DAM, DAW, ASIR y SMR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
